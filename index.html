<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="common.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <!-- All personal content (name, summary, projects, experience…) lives in data.json
       and is filled in by script.js. Edit data.json to update the site. -->

  <p id="load-error" class="load-error" hidden></p>

  <!-- ===== Navigation ===== -->
  <header class="nav">
    <div class="container nav__inner">
      <a href="#home" class="nav__logo" id="nav-logo"></a>

      <input type="checkbox" id="nav-toggle" class="nav__toggle">
      <label for="nav-toggle" class="nav__burger" aria-label="Toggle menu"><span></span></label>

      <nav class="nav__links">
        <a href="#home">Home</a>
        <a href="#projects">Works</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#experience">Experience</a>
        <a href="#contact" class="btn btn--dark nav__cta">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- ===== Hero ===== -->
    <section class="hero" id="home">
      <div class="container hero__inner">
        <p class="hero__hey" id="hero-greeting"></p>
        <div class="hero__photo" id="hero-photo"></div>
        <p class="hero__status" id="hero-status"></p>
        <p class="hero__spec" id="hero-spec"></p>
        <h1 class="hero__name" id="hero-name"></h1>
        <h2 class="hero__role" id="hero-role"></h2>
        <p class="hero__zh" id="hero-subtitle"></p>
      </div>
    </section>

    <!-- ===== Recent Projects ===== -->
    <section class="section" id="projects">
      <div class="container">
        <h2 class="section__title">Recent Projects</h2>
        <p class="section__sub" id="projects-subtitle"></p>
        <div class="projects" id="project-list"></div>
      </div>
    </section>

    <!-- ===== Services ===== -->
    <section class="section section--soft" id="services">
      <div class="container">
        <h2 class="section__title">I Can Help You With</h2>
        <div class="services" id="service-list"></div>
      </div>
    </section>

    <!-- ===== About / Vision ===== -->
    <section class="section" id="about">
      <div class="container">
        <h2 class="section__title">Turning My Vision Into Spaces</h2>
        <div class="vision">
          <div class="vision__text">
            <p class="vision__lead" id="about-lead"></p>
            <div class="vision__paras" id="about-text"></div>
            <div class="stats" id="about-stats"></div>
          </div>
          <div class="vision__img" id="about-image"></div>
        </div>
      </div>
    </section>

    <!-- ===== Experience & Skills ===== -->
    <section class="section section--soft" id="experience">
      <div class="container">
        <h2 class="section__title">Experience &amp; Skills</h2>
        <div class="rows" id="experience-list"></div>

        <div class="skills">
          <div class="skill-card">
            <h4>Software</h4>
            <ul class="chips" id="skills-software"></ul>
          </div>
          <div class="skill-card">
            <h4>Languages</h4>
            <ul class="lang" id="skills-languages"></ul>
          </div>
          <div class="skill-card skill-card--cert" id="skills-certificate"></div>
        </div>
      </div>
    </section>

    <!-- ===== Studio gallery ===== -->
    <section class="section" id="gallery">
      <div class="container">
        <h2 class="section__title">From My Studio</h2>
        <div class="gallery" id="gallery-list"></div>
      </div>
    </section>

    <!-- ===== Contact ===== -->
    <section class="contact" id="contact">
      <div class="container contact__inner">
        <p class="contact__hey" id="contact-greeting"></p>
        <h2 class="contact__title" id="contact-title"></h2>
        <p class="contact__lead" id="contact-lead"></p>
        <a class="btn btn--dark btn--lg" id="contact-email"></a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span class="nav__logo" id="footer-logo"></span>
      <p id="footer-copy"></p>
    </div>
  </footer>

</body>
</html>
